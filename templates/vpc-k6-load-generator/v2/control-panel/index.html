<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>k6 Control Panel</title>
  <style>
    :root {
      --bg: #0f1419; --panel: #1a1f29; --panel-2: #232a36; --border: #2e3744;
      --text: #e6edf3; --muted: #9aa7b8; --accent: #7d64ff; --accent-hover: #9080ff;
      --ok: #3fb950; --stop: #f85149;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5; }
    header { display: flex; align-items: center; gap: 12px; padding: 16px 24px;
      border-bottom: 1px solid var(--border); background: var(--panel); }
    header h1 { font-size: 18px; margin: 0; font-weight: 600; }
    .k6 { color: var(--accent); font-weight: 700; }
    .status-pill { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px;
      border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--panel-2); border: 1px solid var(--border); }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
    .dot.running { background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: pulse 1.4s infinite; }
    @media (prefers-reduced-motion: reduce) { .dot.running { animation: none; } }
    @keyframes pulse { 50% { opacity: 0.4; } }
    main { display: grid; grid-template-columns: 380px 1fr; gap: 20px; padding: 24px; max-width: 1400px; margin: 0 auto; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .card h2 { margin: 0 0 16px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
    label { display: block; font-size: 13px; margin-bottom: 6px; font-weight: 500; }
    .field { margin-bottom: 16px; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
    input, select, textarea { width: 100%; padding: 10px 12px; background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 14px; font-family: inherit; }
    input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px; }
    textarea { resize: vertical; min-height: 60px; font-family: ui-monospace, monospace; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .actions { display: flex; gap: 12px; margin-top: 8px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-start { background: var(--accent); color: #fff; }
    .btn-start:not(:disabled):hover { background: var(--accent-hover); }
    .btn-stop { background: var(--stop); color: #fff; }
    .chip { display: inline-block; margin: 4px 6px 0 0; padding: 3px 10px; font-size: 12px; border-radius: 999px;
      background: var(--panel-2); border: 1px solid var(--border); color: var(--text); cursor: pointer; flex: none; }
    .errors { background: rgba(248, 81, 73, 0.1); border: 1px solid var(--stop); border-radius: 8px; padding: 10px 14px;
      margin-bottom: 16px; font-size: 13px; color: #ffc4c0; }
    .errors ul { margin: 4px 0 0; padding-left: 18px; }
    .right-col { display: flex; flex-direction: column; gap: 20px; }
    .dashboard-frame { width: 100%; height: 460px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
    .placeholder { height: 460px; display: flex; align-items: center; justify-content: center; flex-direction: column;
      gap: 8px; color: var(--muted); border: 1px dashed var(--border); border-radius: 8px; text-align: center; padding: 20px; }
    .logs { background: #0a0d12; border: 1px solid var(--border); border-radius: 8px; padding: 14px;
      font-family: ui-monospace, monospace; font-size: 12px; color: #b4c4d6; height: 240px; overflow-y: auto;
      white-space: pre-wrap; word-break: break-word; margin: 0; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 10px; }
    a { color: #a99bff; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <h1><span class="k6">k6</span> Control Panel</h1>
    <span class="status-pill" role="status" aria-live="polite"><span id="dot" class="dot" aria-hidden="true"></span><span id="statusText">Connecting…</span></span>
  </header>

  <main>
    <section class="card" aria-labelledby="cfg-title">
      <h2 id="cfg-title">Test configuration</h2>
      <div id="errors" class="errors" role="alert" hidden></div>

      <form id="form" novalidate>
        <div class="field" id="tokenField" hidden>
          <label for="token">Access token</label>
          <input id="token" type="password" autocomplete="off" />
          <div class="hint">This panel requires the token set in K6_PANEL_TOKEN on the instance.</div>
        </div>

        <div class="field">
          <label for="targetUrl">Target URL</label>
          <input id="targetUrl" type="url" placeholder="http://my-service.example.com/" required aria-describedby="targetHint" />
          <div class="hint" id="targetHint">For the Struct8 Hub CPU burner use <code>…/loadtest?ms=80</code> with POST.</div>
          <div id="suggestions"></div>
        </div>

        <div class="row">
          <div class="field">
            <label for="vus">Virtual users (VUs)</label>
            <input id="vus" type="number" min="1" value="50" required aria-describedby="vusHint" />
            <div class="hint" id="vusHint"></div>
          </div>
          <div class="field">
            <label for="duration">Duration</label>
            <input id="duration" value="5m" required aria-describedby="durHint" />
            <div class="hint" id="durHint">e.g. 30s, 5m, 1h</div>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="method">HTTP method</label>
            <select id="method">
              <option>GET</option><option>POST</option><option>PUT</option>
              <option>PATCH</option><option>DELETE</option><option>HEAD</option>
            </select>
          </div>
          <div class="field">
            <label for="rps">Rate (requests/s)</label>
            <input id="rps" type="number" min="1" placeholder="unset" aria-describedby="rpsHint" />
            <div class="hint" id="rpsHint">Optional. Blank = as fast as the VUs go.</div>
          </div>
        </div>

        <div class="field">
          <label for="body">Request body</label>
          <textarea id="body" placeholder="Optional. Sent with POST/PUT/PATCH."></textarea>
        </div>

        <div class="actions">
          <button type="submit" id="startBtn" class="btn-start">Start test</button>
          <button type="button" id="stopBtn" class="btn-stop" disabled>Stop test</button>
        </div>
      </form>
      <div class="meta" id="meta"></div>
    </section>

    <div class="right-col">
      <section class="card" aria-labelledby="dash-title">
        <h2 id="dash-title">Live dashboard</h2>
        <div id="dashWrap"></div>
      </section>

      <section class="card" aria-labelledby="out-title">
        <h2 id="out-title">Run output</h2>
        <pre id="logs" class="logs" tabindex="0" aria-label="k6 run output">No run yet.</pre>
      </section>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const els = { start: $("startBtn"), stop: $("stopBtn"), dot: $("dot"), status: $("statusText"),
      errors: $("errors"), logs: $("logs"), dash: $("dashWrap"), meta: $("meta"), token: $("token") };

    let running = null;
    let dashPort = 5665;
    let suggestionsShown = false;

    els.token.value = sessionStorage.getItem("k6PanelToken") || "";

    // Text only: nothing that comes back from the server is ever parsed as HTML.
    function showErrors(list) {
      els.errors.replaceChildren();
      if (!list || !list.length) { els.errors.hidden = true; return; }
      const title = document.createElement("strong");
      title.textContent = "Could not complete the request:";
      const ul = document.createElement("ul");
      for (const e of list) { const li = document.createElement("li"); li.textContent = e; ul.append(li); }
      els.errors.append(title, ul);
      els.errors.hidden = false;
    }

    async function api(path, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (els.token.value) headers["x-panel-token"] = els.token.value;
      const r = await fetch(path, { ...options, headers });
      if (r.status === 401) {
        $("tokenField").hidden = false;
        throw Object.assign(new Error("unauthorized"), { status: 401 });
      }
      const data = await r.json().catch(() => ({}));
      return { ok: r.ok, status: r.status, data };
    }

    function renderDashboard(isRunning) {
      els.dash.replaceChildren();
      if (isRunning) {
        const url = `${location.protocol}//${location.hostname}:${dashPort}/`;
        const frame = document.createElement("iframe");
        frame.className = "dashboard-frame";
        frame.title = "k6 live dashboard";
        frame.src = url;
        const meta = document.createElement("div");
        meta.className = "meta";
        const a = document.createElement("a");
        a.href = url; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Open the dashboard in a new tab";
        meta.append(a, ` (port ${dashPort}; it can take a few seconds to come up after Start).`);
        els.dash.append(frame, meta);
      } else {
        const p = document.createElement("div");
        p.className = "placeholder";
        p.textContent = "The k6 live dashboard appears here while a run is in progress.";
        els.dash.append(p);
      }
    }

    function setRunning(isRunning) {
      if (running === isRunning) return;
      running = isRunning;
      els.start.disabled = isRunning;
      els.stop.disabled = !isRunning;
      els.dot.className = "dot" + (isRunning ? " running" : "");
      els.status.textContent = isRunning ? "Running" : "Idle";
      renderDashboard(isRunning);
    }

    function showSuggestions(list) {
      if (suggestionsShown || !list || !list.length) return;
      suggestionsShown = true;
      const box = $("suggestions");
      const hint = document.createElement("div");
      hint.className = "hint";
      hint.textContent = "Wired to this instance:";
      box.append(hint);
      for (const url of list) {
        const b = document.createElement("button");
        b.type = "button"; b.className = "chip"; b.textContent = url;
        b.addEventListener("click", () => { $("targetUrl").value = url; $("targetUrl").focus(); });
        box.append(b);
      }
      if (!$("targetUrl").value) $("targetUrl").value = list[0];
    }

    async function refresh() {
      try {
        const { data: s } = await api("/api/status");
        dashPort = s.dashboardPort || dashPort;
        showSuggestions(s.suggestedTargets);
        if (s.limits) {
          $("vus").max = s.limits.maxVus;
          $("vusHint").textContent = `Up to ${s.limits.maxVus} on this panel.`;
          $("durHint").textContent = `e.g. 30s, 5m, 1h (max ${Math.round(s.limits.maxDurationSeconds / 60)} min)`;
        }
        els.meta.replaceChildren();
        if (s.platform) els.meta.append(`Docker platform: ${s.platform}. `);
        if (s.reportAvailable) {
          const a = document.createElement("a");
          a.href = "/report"; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Last run's HTML report";
          els.meta.append(a);
        }
        setRunning(!!s.running);
        if (s.logs) {
          const atBottom = els.logs.scrollTop + els.logs.clientHeight >= els.logs.scrollHeight - 20;
          els.logs.textContent = s.logs;
          if (atBottom) els.logs.scrollTop = els.logs.scrollHeight;
        }
        if (!s.running && s.lastRun) els.status.textContent = `Idle (last run exit ${s.lastRun.exitCode})`;
      } catch (e) {
        els.status.textContent = e.status === 401 ? "Token required" : "Unreachable";
      }
    }

    $("form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      showErrors([]);
      sessionStorage.setItem("k6PanelToken", els.token.value);
      els.start.disabled = true;
      const payload = {
        targetUrl: $("targetUrl").value, vus: Number($("vus").value), duration: $("duration").value,
        rps: $("rps").value, method: $("method").value, body: $("body").value,
      };
      try {
        const { ok, data } = await api("/api/start", {
          method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload),
        });
        if (!ok) { showErrors(data.errors || [data.error || "Unknown error"]); els.start.disabled = false; return; }
        els.logs.textContent = "Starting k6…";
        setRunning(true);
      } catch (e) {
        showErrors([e.status === 401 ? "Enter the access token and try again." : "Network error: " + e.message]);
        els.start.disabled = false;
      }
    });

    els.stop.addEventListener("click", async () => {
      els.stop.disabled = true;
      try { await api("/api/stop", { method: "POST" }); } catch (e) { /* the next refresh shows the truth */ }
      refresh();
    });

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
