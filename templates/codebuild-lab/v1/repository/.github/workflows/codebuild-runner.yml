# Runs the unit tests on the CodeBuild-hosted GitHub Actions runner: each job
# becomes a build of the CodeBuild project named codebuild-lab-runner (EC2, Arm),
# whose webhook listens for WORKFLOW_JOB_QUEUED. That project ignores any
# buildspec; this file is what the build runs.
#
# The label is how CodeBuild finds the project:
#   codebuild-<project name>-${{ github.run_id }}-${{ github.run_attempt }}
# A project with another name needs this line changed to match, or the job
# waits for a runner that never comes.
name: Unit tests on the CodeBuild runner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: codebuild-codebuild-lab-runner-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Show where the job runs
        run: echo "Architecture $(uname -m), Node.js $(node --version)"
      - name: Unit tests
        working-directory: app
        run: |
          npm ci
          npm run test:unit
